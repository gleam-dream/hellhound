name = "relay_consumer"
version = "0.0.0"
target = "erlang"
description = "Compiles the README's Relay verifier recipe against Relay and Hellhound; src/recipe.gleam is generated by scripts/relay-recipe, and test/ runs it through Relay's admit."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
hellhound = { path = ".." }
relay = ">= 0.1.0 and < 0.2.0"
sinal = ">= 0.1.0 and < 0.2.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
