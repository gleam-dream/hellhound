name = "relay_consumer"
version = "0.0.0"
target = "erlang"
description = "Compiles the README's Relay verifier recipe against Relay and Hellhound; src/recipe.gleam is generated by scripts/relay-recipe, and test/ runs it through Relay's admit."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
hellhound = { path = ".." }
# Floor for the transitive Relay dependency: from json_blueprint 2.2.0 a
# codec copies between processes at about its own size.
json_blueprint = ">= 2.2.0 and < 3.0.0"
# Relay 0.2.2 holds the server once instead of copying it per request.
relay = ">= 0.2.2 and < 0.3.0"
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "29ea7a90bf820b3c91eb3f76e824abe0d034d78f" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
