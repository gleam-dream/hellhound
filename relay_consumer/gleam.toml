name = "relay_consumer"
version = "0.0.0"
target = "erlang"
description = "Compiles the README's Relay verifier recipe against Relay and Hellhound; src/recipe.gleam is generated by scripts/relay-recipe, and test/ runs it through Relay's admit."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
hellhound = { path = ".." }
# Unreleased integration heads; Relay's head pins these same json_blueprint,
# http_gun and sinal commits, so each package has one source.
json_blueprint = { git = "https://github.com/gleam-dream/json_blueprint.git", ref = "0cc991164771a85cf6496efe0d2413fd59b300cf" }
relay = { git = "https://github.com/gleam-dream/relay.git", ref = "549261f40527b565d527b3adeb2fd9ff35880e59" }
http_gun = { git = "https://github.com/gleam-dream/http_gun.git", ref = "0a1e5b9c8db5d40b2277df3fd76d89e9563fe84c" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "02d386e070c6a99900225c613e8d273f3bebe3c2" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
