name = "relay_consumer"
version = "0.0.0"
target = "erlang"
description = "Compiles the README's Relay verifier recipe against Relay and Hellhound; src/recipe.gleam is generated by scripts/relay-recipe, and test/ runs it through Relay's admit."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
hellhound = { path = ".." }
relay = { git = "https://github.com/gleam-dream/relay.git", ref = "0f81df9e163f5f7a29ee8a724ea29dee0647117f" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "95f2dbce4459942e16e819e3527eb00d9c503c9d" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
