name = "relay_consumer"
version = "0.0.0"
target = "erlang"
description = "Compiles the README's Relay verifier recipe against Relay and Warden; src/recipe.gleam is generated by scripts/relay-recipe, and test/ runs it through Relay's admit."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
warden = { path = ".." }
relay = { git = "https://github.com/gleam-dream/relay.git", ref = "ef58066e31a11ef5d9b469867e4beec90eba97b5" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "4aee4c3b920bd7241da7659995dfc0a0b5767348" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
