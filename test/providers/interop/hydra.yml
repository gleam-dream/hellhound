# Disposable Ory Hydra configuration for Hellhound interoperability tests.
dsn: memory
serve:
  tls:
    enabled: true
    cert:
      path: /pki/localhost.pem
    key:
      path: /pki/localhost.key
urls:
  self:
    issuer: https://localhost:14444
  login: https://localhost:14446/login
  consent: https://localhost:14446/consent
  logout: https://localhost:14446/logout
secrets:
  system:
    - hellhound-hydra-disposable-system-secret
oauth2:
  pkce:
    enforced: true
strategies:
  access_token: jwt
